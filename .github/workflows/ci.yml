name: CI

on:
  push:
    branches: [minimal]
  pull_request:
    branches: [minimal]

jobs:
  test:
    name: Minimal (v1) — self-hosting fixpoint + tests
    runs-on: ubuntu-latest   # x86-64 Linux: the compiler emits and runs ELF64 binaries
    steps:
      - uses: actions/checkout@v4

      - name: Milestones + fixpoint
        run: bash minimal/test/run.sh

      # self/golf.golf is GENERATED by tools/mkblob.py from the code sections and
      # boot/golf0.py's templates.  The checked-in file may not drift from what
      # the generator produces — the fixpoint above would still pass on a stale
      # artifact, since it only ever compares the compiler against itself.
      - name: The checked-in compiler source matches the generator
        run: |
          python3 minimal/tools/mkblob.py
          git diff --exit-code -- minimal/self/golf.golf
